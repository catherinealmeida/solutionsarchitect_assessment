<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breezy Admin Panel</title>

  <!-- Reset -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize@1.1.0/modern-normalize.min.css">

  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <div class="dashboard">
    <h2>HubSpot Sync</h2>
    <h2>HubSpot Deals</h2>
    <div id="loadingDeals" class="loading" style="display:none;">Loading deals...</div>
    <div id="errorDeals" class="msg" style="display:none;"></div>

    <table id="dealsTable" style="display:none;">
      <thead>
        <tr>
          <th>Deal Name</th>
          <th>Amount</th>
          <th>Deal Stage</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function fetchDeals() {
      document.getElementById("loadingDeals").style.display = "block";
      document.getElementById("errorDeals").style.display = "none";
      document.getElementById("dealsTable").style.display = "none";

      try {
        const response = await fetch('http://localhost:3001/api/deals');
        const result = await response.json();

        const deals = result.results;

        if (!Array.isArray(deals)) {
          throw new Error("Response is not an array: " + JSON.stringify(result));
        }

        const rowsHtml = deals.map(d => `
          <tr>
            <td>${d.properties.dealname || ''}</td>
            <td>${d.properties.amount || ''}</td>
            <td>${d.properties.dealstage || ''}</td>
          </tr>
        `).join('');

        document.querySelector("#dealsTable tbody").innerHTML = rowsHtml;
        document.getElementById("dealsTable").style.display = "";
      } catch (err) {
        document.getElementById("errorDeals").textContent = "Failed to load deals: " + err.message;
        document.getElementById("errorDeals").style.display = "block";
      } finally {
        document.getElementById("loadingDeals").style.display = "none";
      }
    }

    window.onload = fetchDeals;
  </script>

</body>
</html>
